# BDownloader's installer, built with B-Installer (https://github.com/ahmedanjum30/B-Installer)
# by scripts\build-installer.ps1, which passes the version and the folder with the binaries.
#
# Installs for the current user only (no admin prompt), into %LOCALAPPDATA%\Programs\BDownloader;
# it can also install for everyone on the PC.

[defines]
version = "0.0.0"
root = ".."
bindir = "..\\target\\release"

[app]
# Never change it: it's the AppId of the Inno Setup installs this one updates.
id = "6A1E3C52-8F0B-4D7E-9B2A-5C4F1D3E7A90"
name = "BDownloader"
version = "${version}"
publisher = "Ahmad Anjum"
url = "https://github.com/ahmedanjum30/BDownloader"
support_url = "https://github.com/ahmedanjum30/BDownloader/issues"
dir = '{pf}\BDownloader'
uninstall_icon = '{app}\BDownloader.exe'
icon = '${root}\crates\app\assets\bdownloader.ico'
license = '${root}\LICENSE'
output = '${root}\dist\BDownloader-Setup-${version}.exe'

# Versions before 1.0.11 shipped the Firefox add-on; it's on Firefox Add-ons now.
delete = ['{app}\bdownloader-firefox.xpi']

[[task]]
name = "desktopicon"
label = "Create a desktop shortcut"

# Only takes effect in an install for everyone, which has administrator rights.
[[task]]
name = "firewall"
label = "Allow torrents through Windows Firewall (when installing for everyone)"

[[file]]
source = '${bindir}\BDownloader.exe'
dest = '{app}'

[[file]]
source = '${bindir}\bdl-host.exe'
dest = '{app}'

[[file]]
source = '${root}\extension'
dest = '{app}\extension'

[[file]]
source = '${root}\LICENSE'
dest = '{app}'
rename = "LICENSE.txt"

[[file]]
source = '${root}\PRIVACY.md'
dest = '{app}'

[[shortcut]]
path = '{programs}\BDownloader'
target = '{app}\BDownloader.exe'

[[shortcut]]
path = '{desktop}\BDownloader'
target = '{app}\BDownloader.exe'
task = "desktopicon"

# The Edge Add-ons ID, the same as EDGE_STORE_ID in crates\app\src\browser.rs: Edge offers to
# add the extension the next time it starts. Add the same for Chrome once it's on the Chrome
# Web Store (Software\Google\Chrome\Extensions\<id>, https://clients2.google.com/service/update2/crx).
[[registry]]
root = "HKCU"
key = 'Software\Microsoft\Edge\Extensions\kfbjnlpmchkeaphhdeidpdpcomoohdfa'
name = "update_url"
value = "https://edge.microsoft.com/extensionwebstorebase/v1/crx"
uninstall = "key"

# Torrents: .torrent files and magnet links can open in BDownloader. Listed in Default apps and
# "Open with", so a torrent app the user picked as the default keeps them. HKA: the user's, or
# everyone's for an install for everyone.
[[registry]]
root = "HKA"
key = 'Software\Classes\BDownloader.torrent'
value = "Torrent file"
uninstall = "key"

[[registry]]
root = "HKA"
key = 'Software\Classes\BDownloader.torrent\DefaultIcon'
value = '{app}\BDownloader.exe,0'

[[registry]]
root = "HKA"
key = 'Software\Classes\BDownloader.torrent\shell\open\command'
value = '"{app}\BDownloader.exe" "%1"'

[[registry]]
root = "HKA"
key = 'Software\Classes\BDownloader.magnet'
value = "Magnet link"
uninstall = "key"

[[registry]]
root = "HKA"
key = 'Software\Classes\BDownloader.magnet'
name = "URL Protocol"
value = ""

[[registry]]
root = "HKA"
key = 'Software\Classes\BDownloader.magnet\DefaultIcon'
value = '{app}\BDownloader.exe,0'

[[registry]]
root = "HKA"
key = 'Software\Classes\BDownloader.magnet\shell\open\command'
value = '"{app}\BDownloader.exe" "%1"'

# The magnet: protocol itself. Without it Windows doesn't know magnet links at all, and browsers
# do nothing when one is clicked. A default the user picked (Default apps) still comes first.
[[registry]]
root = "HKA"
key = 'Software\Classes\magnet'
value = "URL:Magnet link"
uninstall = "key"

[[registry]]
root = "HKA"
key = 'Software\Classes\magnet'
name = "URL Protocol"
value = ""

[[registry]]
root = "HKA"
key = 'Software\Classes\magnet\DefaultIcon'
value = '{app}\BDownloader.exe,0'

[[registry]]
root = "HKA"
key = 'Software\Classes\magnet\shell\open\command'
value = '"{app}\BDownloader.exe" "%1"'

[[registry]]
root = "HKA"
key = 'Software\Classes\.torrent\OpenWithProgids'
name = "BDownloader.torrent"
value = ""

[[registry]]
root = "HKA"
key = 'Software\BDownloader\Capabilities'
name = "ApplicationName"
value = "BDownloader"
uninstall = "key"

[[registry]]
root = "HKA"
key = 'Software\BDownloader\Capabilities'
name = "ApplicationDescription"
value = "A fast download manager, for files and torrents."

[[registry]]
root = "HKA"
key = 'Software\BDownloader\Capabilities\FileAssociations'
name = ".torrent"
value = "BDownloader.torrent"

[[registry]]
root = "HKA"
key = 'Software\BDownloader\Capabilities\URLAssociations'
name = "magnet"
value = "BDownloader.magnet"

[[registry]]
root = "HKA"
key = 'Software\RegisteredApplications'
name = "BDownloader"
value = 'Software\BDownloader\Capabilities'

# The "firewall" checkbox: lets torrent peers connect (seeding needs them to), so Windows
# Firewall doesn't ask on the first torrent. Needs administrator rights: only an install for
# everyone gets it; for one user netsh fails quietly and Windows asks as usual. The old rule goes
# first, so reinstalls don't pile up copies, and unticking the box on an update removes it.
[[run]]
file = '{sys}\netsh.exe'
args = 'advfirewall firewall delete rule name="BDownloader"'
hidden = true

[[run]]
file = '{sys}\netsh.exe'
args = 'advfirewall firewall add rule name="BDownloader" description="Lets torrent peers connect to BDownloader." dir=in action=allow program="{app}\BDownloader.exe" enable=yes profile=any'
hidden = true
task = "firewall"

# The app always runs as the user, never as the administrator an install for everyone runs
# as: the browser can't reach a BDownloader running as administrator, and its settings are the
# user's. Lets the browser extension reach the app, even before the app is first opened.
[[run]]
file = '{app}\BDownloader.exe'
args = "--register"
hidden = true
as_user = true

[[run]]
file = '{app}\BDownloader.exe'
launch = true

# Updates started from the app (/UPDATE=1 or 2) bring it back afterwards; 2 means in the tray.
[[run]]
file = '{app}\BDownloader.exe'
if_param = "UPDATE=1"
wait = false
as_user = true

[[run]]
file = '{app}\BDownloader.exe'
args = "--background"
if_param = "UPDATE=2"
wait = false
as_user = true

[[uninstall_run]]
file = '{app}\BDownloader.exe'
args = "--unregister"
hidden = true

[[uninstall_run]]
file = '{sys}\netsh.exe'
args = 'advfirewall firewall delete rule name="BDownloader"'
hidden = true
