name: Store check

# Run by hand (Actions → Store check → Run workflow) to check the Microsoft
# Store credentials: signs in and shows the Store's package and status,
# without changing anything.
on:
  workflow_dispatch:

jobs:
  msstore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show the Microsoft Store package
        shell: pwsh
        run: ./scripts/publish-msstore.ps1 -DryRun
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
