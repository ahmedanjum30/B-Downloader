name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Run the JavaScript-based actions (checkout, cache, release) on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The same format, lint and test checks as CI. They run alongside the
  # build; nothing is published unless both succeed.
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Compiled dependencies from CI's release-cache job on main. Tag builds
      # can't reuse each other's caches, so this one only restores.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
        env:
          # Mozilla signs the Firefox add-on (scripts/sign-firefox.ps1).
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Package
        shell: pwsh
        run: |
          # The extension on its own, for the Chrome Web Store and Edge Add-ons.
          ./scripts/package-extension.ps1
          Get-ChildItem dist -File -Include *.zip, *.exe, bdownloader-firefox-*.xpi -Exclude *-unsigned.xpi -Recurse | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/BDownloader-Setup-*.exe
            dist/bdownloader-extension-*.zip
            # The signed Firefox add-on, and the file installed copies check
            # for updates (its update_url leads to the latest release's copy).
            dist/bdownloader-firefox-*.xpi
            !dist/*-unsigned.xpi
            dist/firefox-updates.json
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: [checks, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # Shown above the generated list of changes.
          body: |
            ## Install

            Download **BDownloader-Setup-${{ github.ref_name }}.exe** below and run it. It installs for your user only, without admin rights. Already have BDownloader 0.1.1 or later? It updates itself.

            > **Windows says "Windows protected your PC"?** Click **More info**, then **Run anyway**. BDownloader isn't code-signed yet, so Windows doesn't know the publisher. The installer is the one built by this repository's release workflow; you can check it against `SHA256SUMS.txt`.

            To add the browser extension, open **Browser extension** in BDownloader; Firefox takes one click there. The extension zip is for the Chrome Web Store and Edge Add-ons.
          generate_release_notes: true

  # A changed extension goes to Edge Add-ons for review; Edge then updates it
  # by itself. Skipped when the extension is unchanged or the secrets aren't set.
  edge:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags, to compare with the previous release's extension.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Submit to Edge Add-ons
        shell: pwsh
        run: ./scripts/publish-edge.ps1
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
