name: Release

# scripts/release.ps1 tags main and pushes the tag. The tag is the version:
# each build writes it into Cargo.toml (scripts/set-version.sh), so releases
# need no version-bump commit. The format, lint and test checks already ran
# in CI on main, so a release goes straight to building.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      # Compiled dependencies from release-cache.yml's windows job on main. Tag builds
      # can't reuse each other's caches, so this one only restores.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      # After the cache is restored: its key includes Cargo.toml.
      - name: Version from the tag
        shell: bash
        run: sh scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      # Its prebuilt bi.exe and bi-setup.exe, which have to sit side by side.
      - name: Install B-Installer
        shell: pwsh
        run: |
          $dir = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'b-installer')
          foreach ($exe in 'bi.exe', 'bi-setup.exe') {
            Invoke-WebRequest "https://github.com/ahmedanjum30/B-Installer/releases/download/v0.1.1/$exe" -OutFile "$dir\$exe"
          }
          Add-Content $env:GITHUB_PATH $dir

      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Package
        shell: pwsh
        run: |
          # The extension on its own, for the Chrome Web Store and Edge Add-ons.
          ./scripts/package-extension.ps1
          Get-ChildItem dist -File -Include *.zip, *.exe -Recurse | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            dist/BDownloader-Setup-*.exe
            dist/bdownloader-extension-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # The Microsoft Store package, with this release's version, to upload
      # in Partner Center: the run's artifacts have it. Unsigned (the Store
      # signs it), so it isn't a release file. Never holds the release up.
      - name: Microsoft Store package
        id: msix
        continue-on-error: true
        shell: pwsh
        run: ./scripts/build-msix.ps1
      - uses: actions/upload-artifact@v7
        if: steps.msix.outcome == 'success'
        with:
          name: microsoft-store-msix
          path: dist/BDownloader-*.msix

  # The macOS app for Apple Silicon (M1 and later), zipped for Homebrew.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      # Compiled dependencies from release-cache.yml's macos job on main.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos
          save-if: false
      # After the cache is restored: its key includes Cargo.toml.
      - name: Version from the tag
        shell: bash
        run: sh scripts/set-version.sh "${GITHUB_REF_NAME#v}"
      - name: Build the app
        run: sh scripts/macos-app.sh --native
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/B-Downloader-*-macos.zip
          if-no-files-found: error

  publish:
    needs: [build, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-macos
          path: dist
      - name: Add the macOS app to the checksums
        run: cd dist && sha256sum B-Downloader-*-macos.zip >> SHA256SUMS.txt

      # The notes: this version's section of CHANGELOG.md, then how to
      # install. GitHub adds the list of changes below them.
      - uses: actions/checkout@v7
        with:
          path: source
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Write the release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The lines under "## [<version>]", up to the next version's heading.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' source/CHANGELOG.md > changes.md
          {
            echo "## What's new in $version"
            if grep -q '[^[:space:]]' changes.md; then
              cat changes.md
            else
              echo "::warning::CHANGELOG.md has no entry for $version" >&2
            fi
            cat <<EOF

          ## Install

          **Windows:** download **BDownloader-Setup-$version.exe** below and run it. It installs for your user only, without admin rights. Already have BDownloader? It updates itself.

          > **Windows says "Windows protected your PC"?** Click **More info**, then **Run anyway**. BDownloader isn't code-signed yet, so Windows doesn't know the publisher. The installer is the one built by this repository's release workflow; you can check it against \`SHA256SUMS.txt\`.

          **Mac (Apple Silicon):** \`brew install --cask ahmedanjum30/tap/b-downloader\`, or \`brew upgrade\` if you have it. Or download **B-Downloader-$version-macos.zip** below, unzip it and drag the app to Applications; the first time, right-click it and choose **Open**.

          To add the browser extension, open **Browser extension** in BDownloader. It's on [Firefox Add-ons](https://addons.mozilla.org/firefox/addon/bdownloader/) and [Edge Add-ons](https://microsoftedge.microsoft.com/addons/detail/kfbjnlpmchkeaphhdeidpdpcomoohdfa). The extension zip is for loading it unpacked in other Chromium browsers.
          EOF
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true

  # A changed extension goes to Firefox Add-ons for review; Firefox then
  # updates it by itself. Skipped when the extension is unchanged or the
  # secrets aren't set.
  firefox:
    needs: publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags, to compare with the previous release's extension.
          fetch-depth: 0
      - name: Submit to Firefox Add-ons
        shell: pwsh
        run: ./scripts/publish-firefox.ps1
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

  # A changed extension goes to Edge Add-ons for review; Edge then updates it
  # by itself. Skipped when the extension is unchanged or the secrets aren't set.
  edge:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags, to compare with the previous release's extension.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      - name: Submit to Edge Add-ons
        shell: pwsh
        run: ./scripts/publish-edge.ps1
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}

  # The new version's cask goes to the Homebrew tap (ahmedanjum30/homebrew-tap),
  # so `brew upgrade` finds it. Skipped without the HOMEBREW_TAP_TOKEN secret
  # (a token that can push to the tap).
  homebrew:
    needs: publish
    runs-on: macos-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          name: release-macos
          path: dist
      - name: Update the cask
        if: env.HOMEBREW_TAP_TOKEN != ''
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/ahmedanjum30/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sh scripts/homebrew-cask.sh "$version" "dist/B-Downloader-$version-macos.zip" > tap/Casks/b-downloader.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/b-downloader.rb
          git commit -m "b-downloader $version"
          git push

  # The installer, also at a fixed link without redirects, on GitHub Pages:
  # https://ahmedanjum30.github.io/B-Downloader/download/<version>/. The
  # Microsoft Store installs from such a link (GitHub's release links redirect).
  pages:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release
      - name: Add the installer
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "download/$version"
          cp "release/BDownloader-Setup-$version.exe" "download/$version/"
          rm -rf release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download
          git commit -m "Installer $version"
          git push

  # The new version goes to the Microsoft Store: its package points to the
  # installer on GitHub Pages, then it's submitted for certification.
  # Skipped without the MSSTORE_* secrets, or while a submission is in review.
  # Paused: this Store listing takes only signed installers. The Store version
  # is now the MSIX package (scripts/build-msix.ps1), submitted by hand until
  # its submission is automated.
  msstore:
    if: false
    needs: pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Submit to the Microsoft Store
        shell: pwsh
        run: ./scripts/publish-msstore.ps1
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
