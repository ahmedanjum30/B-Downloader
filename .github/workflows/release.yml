name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Run the JavaScript-based actions (checkout, cache, release) on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Package
        shell: pwsh
        run: |
          # The extension on its own, for the Chrome Web Store and Edge Add-ons.
          ./scripts/package-extension.ps1
          Get-ChildItem dist -File -Include *.zip, *.exe -Recurse | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BDownloader-Setup-*.exe
            dist/bdownloader-extension-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
