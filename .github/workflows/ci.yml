name: CI

# Only run when code or build settings change; docs-only commits skip CI.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
  # The release workflow runs these checks before building.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # The macOS app, on Apple Silicon.
  macos:
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The app for Apple Silicon, to try out: the run's artifacts have it.
      - name: Build the app
        run: sh scripts/macos-app.sh --native
      - uses: actions/upload-artifact@v7
        with:
          name: B-Downloader-macos
          path: dist/*.zip

  # Builds the release profile on main and saves the compiled dependencies,
  # so release builds (on tags, which can only restore caches from main)
  # only recompile BDownloader itself. Runs alongside the checks.
  release-cache:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Build release
        run: cargo build --release --workspace
