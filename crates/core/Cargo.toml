[package]
name = "bdownloader-core"
description = "Download engine for BDownloader: multi-connection segmented downloads with resume"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Windows' own TLS (SChannel): no C toolchain needed and it uses the system certificate store.
# No compression features: a decompressed body can't be split into byte ranges.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
tokio = { version = "1.53", features = ["rt", "fs", "sync", "time", "macros"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
percent-encoding = "2"
sha2 = "0.11"
md-5 = "0.11"
aes = "0.9.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tempfile = "3"
