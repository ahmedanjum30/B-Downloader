[package]
name = "bdownloader"
description = "A fast download manager for Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"

[[bin]]
name = "BDownloader"
path = "src/main.rs"

[dependencies]
bdownloader-core.workspace = true
bdownloader-ipc.workspace = true
# `tokio` runs the app's tasks on the same runtime the download engine uses.
# The software renderer (tiny-skia) instead of the GPU one (wgpu): a list of
# downloads doesn't need a GPU, and setting up a GPU device costs over 100 MB.
iced = { version = "0.14", default-features = false, features = ["wgpu-bare", "tiny-skia", "crisp", "web-colors", "tokio", "svg"] }
rfd = "0.17"
# iced's GPU renderer with only the DirectX 12 back-end (iced's own "wgpu"
# feature brings Vulkan, OpenGL and others too, which only add size here).
wgpu = { version = "27", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
log = "0.4"
# Moves deleted downloads to the Recycle Bin.
trash = { version = "5.2", default-features = false, features = ["coinit_apartmentthreaded"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time"] }
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_System_Memory", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
winresource = "0.1"
