[workspace]
members = ["crates/core", "crates/ipc", "crates/cli", "crates/host", "crates/app"]
resolver = "3"

[workspace.package]
version = "1.0.6"
edition = "2024"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/ahmedanjum30/BDownloader"
authors = ["Ahmad Anjum"]

[workspace.dependencies]
bdownloader-core = { path = "crates/core" }
bdownloader-ipc = { path = "crates/ipc" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# For local test installers (`build-installer.ps1 -Quick`): as fast at
# runtime for testing, but builds in parallel and reuses unchanged code,
# instead of optimising the whole program as one unit on one core.
# Releases use the full release profile above.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
