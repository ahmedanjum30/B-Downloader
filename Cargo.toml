[workspace]
members = ["crates/core", "crates/ipc", "crates/cli", "crates/host", "crates/app"]
resolver = "3"

[workspace.package]
version = "1.4.0"
edition = "2024"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/ahmedanjum30/B-Downloader"
authors = ["Ahmad Anjum"]

[workspace.dependencies]
bdownloader-core = { path = "crates/core" }
bdownloader-ipc = { path = "crates/ipc" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# For local test installers (`build-installer.ps1 -Quick`): as fast at
# runtime for testing, but builds in parallel and reuses unchanged code,
# instead of optimising the whole program as one unit on one core.
# Releases use the full release profile above.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# librqbit's socket layer, patched to route torrents' TCP and UDP (uTP, DHT,
# UDP trackers) through a SOCKS5 proxy: see third_party/librqbit-dualstack-sockets/PATCHED.md.
[patch.crates-io]
librqbit-dualstack-sockets = { path = "third_party/librqbit-dualstack-sockets" }
# librqbit itself, patched so a finished torrent's files aren't held open for
# writing while it's shared (a downloaded installer can run): see
# third_party/librqbit/PATCHED.md.
librqbit = { path = "third_party/librqbit" }
