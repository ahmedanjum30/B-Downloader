[workspace]
members = ["crates/core", "crates/cli", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/ahmedanjum30/BDownloader"
authors = ["Ahmad Anjum"]

[workspace.dependencies]
bdownloader-core = { path = "crates/core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
