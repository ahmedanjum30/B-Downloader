<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BDownloader</title>
<meta name="description" content="BDownloader: a fast, lightweight download manager for Windows, with multi-connection downloads, pause and resume, and a browser extension.">
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --accent: #6366f1; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --accent: #818cf8; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
  h1 { margin: 0 0 8px; font-size: 32px; }
  p { color: var(--muted); }
  a { color: var(--accent); }
  .button { display: inline-block; margin: 16px 12px 0 0; padding: 10px 18px; border-radius: 8px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>BDownloader</h1>
  <p>A fast, lightweight download manager for Windows. It downloads each file over several connections at once, pauses and resumes anything, and catches downloads and videos from your browser.</p>
  <a class="button" href="https://github.com/ahmedanjum30/BDownloader/releases/latest">Download for Windows</a>
  <a href="https://github.com/ahmedanjum30/BDownloader">Source code and documentation</a>
</main>
</body>
</html>
