<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>When done</title>
<link rel="stylesheet" href="screens.css">
<script src="screens.js"></script>
</head>
<body>
<div class="window" data-backdrop>
  <div class="scrim">
    <section class="dialog" role="dialog" aria-label="When done">
      <header class="dlg-head"><h1>Going to sleep</h1></header>
      <div style="display:flex;align-items:center;gap:18px">
        <div class="big-count num">54</div>
        <p style="margin:0">Downloads are done. Your PC will go to sleep in 54 seconds.<br><span class="t-muted">Cancel to keep it on.</span></p>
      </div>
      <footer class="dlg-foot"><a class="btn" href="main.html">Cancel</a><button class="btn primary"><svg class="i"><use href="icons.svg#power"/></svg>Sleep now</button></footer>
    </section>
  </div>
</div>
</body>
</html>
