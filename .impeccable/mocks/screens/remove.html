<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remove download</title>
<link rel="stylesheet" href="screens.css">
<script src="screens.js"></script>
</head>
<body>
<div class="window" data-backdrop>
  <div class="scrim">
    <section class="dialog" role="dialog" aria-label="Remove download">
      <header class="dlg-head"><h1>Remove download</h1><a class="icon-btn" href="main.html" aria-label="Close"><svg class="i lg"><use href="icons.svg#close"/></svg></a></header>
      <div class="file-card"><span class="badge">MKV</span><div><div class="name">nature-documentary-4k.mkv</div><div class="meta num">281 MB of 700 MB</div></div></div>
      <p style="margin:0">The download stops and is removed from the list. The 281 MB downloaded so far will be deleted.</p>
      <label class="check"><input type="checkbox">Also delete the file from disk (moves it to the Recycle Bin)</label>
      <footer class="dlg-foot"><a class="btn ghost" href="main.html">Cancel</a><button class="btn danger">Cancel and remove</button></footer>
    </section>
  </div>
</div>
</body>
</html>
